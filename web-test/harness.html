<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>labeler harness</title>
  <link rel="stylesheet" href="../docs/style.css">
  <style>
    html, body { overflow: auto; }
    #app { height: 900px; width: 1400px; }
    #results { white-space: pre; font: 12px monospace; background: #fff; color: #000; padding: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <pre id="results">running</pre>
  <script>
    window.addEventListener('error', (e) => { document.getElementById('results').textContent = 'FAIL script error: ' + e.message + ' @' + e.filename + ':' + e.lineno + '\n\nFAILURES: 1'; document.title = 'DONE'; });
    window.addEventListener('unhandledrejection', (e) => { document.getElementById('results').textContent = 'FAIL unhandled rejection: ' + (e.reason && e.reason.stack || e.reason) + '\n\nFAILURES: 1'; document.title = 'DONE'; });
  </script>
  <script type="module">
    import { Labeler, drawLabels, outlineFor, COLOURS, isImageFile, isHeic, FS_ACCESS, CACHE_MAX_AGE, splitMath, math } from '../docs/app.js';
    import { AD_PINOUT } from '../docs/pinouts.js';

    const out = [];
    let fails = 0;
    const check = (cond, msg) => { out.push((cond ? 'PASS ' : 'FAIL ') + msg); if (!cond) fails++; };
    const near = (a, b, tol = 3) => Math.abs(a - b) < tol;
    const tick = (ms = 30) => new Promise((r) => setTimeout(r, ms));

    function makeBoard(w, h) {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const d = cv.getContext('2d');
      d.fillStyle = '#d7d2c8'; d.fillRect(0, 0, w, h);
      d.fillStyle = '#f5f3ee'; d.fillRect(w * 0.05, h * 0.15, w * 0.9, h * 0.7);
      const step = w / 60;
      d.fillStyle = '#3c3c3c';
      for (let gx = 6; gx < 55; gx++) for (let gy = 12; gy < 46; gy++) {
        if (gy === 27 || gy === 28) continue;
        d.fillRect(w * 0.05 + gx * step, h * 0.15 + gy * step, step * 0.4, step * 0.4);
      }
      d.fillStyle = '#c81e1e'; d.fillRect(w * 0.06, h * 0.175, w * 0.88, step / 3);
      d.fillStyle = '#1e3cc8'; d.fillRect(w * 0.06, h * 0.215, w * 0.88, step / 3);
      d.fillStyle = '#c8aa6e'; d.fillRect(w * 0.30, h * 0.45, w * 0.12, h * 0.03);
      d.fillStyle = '#dc2828'; d.beginPath(); d.ellipse(w * 0.62, h * 0.435, w * 0.02, h * 0.035, 0, 0, 7); d.fill();
      d.fillStyle = '#1e1e1e'; d.fillRect(w * 0.45, h * 0.55, w * 0.13, h * 0.11);
      return cv;
    }
    async function toFile(cv, name, type) {
      const blob = await new Promise((r) => cv.toBlob(r, type, 0.92));
      return new File([blob], name, { type, lastModified: 1700000000000 });
    }

    try {
      localStorage.clear();
      const app = new Labeler(document.getElementById('app'), { resume: false });
      window.app = app;
      await app.clearSession();
      const f1 = await toFile(makeBoard(4000, 3000), 'IMG_0001.jpg', 'image/jpeg');
      const f2 = await toFile(makeBoard(1200, 800), 'IMG_0002.png', 'image/png');
      const f3 = await toFile(makeBoard(800, 600), 'IMG_0001_labeled.jpg', 'image/jpeg');
      const f4 = await toFile(makeBoard(800, 600), 'IMG_0001_labeled_2.jpg', 'image/jpeg');
      const notes = new File(['hi'], 'notes.txt', { type: 'text/plain' });
      await app.openFiles([f1, f2, f3, f4, notes]);
      await tick();
      check(app.images.length === 2 && app.images[0].name === 'IMG_0001.jpg', `opens images, skips *_labeled and non-images: ${app.images.map((i) => i.name)}`);
      check(!!app.folderInput && app.folderInput.hasAttribute('webkitdirectory'), 'folder picker present');
      check(app.current.width === 4000 && app.scale < 1, `large image scaled to fit: ${app.scale.toFixed(3)}`);

      const c = app.canvas;
      const W = () => app.current.width, H = () => app.current.height;
      const disp = (fx, fy) => app.toDisplay(W() * fx, H() * fy);
      const rect = () => c.getBoundingClientRect();
      function ptr(type, [x, y], extra = {}) {
        const r = rect();
        c.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 1,
          isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerType: 'mouse', ...extra }));
      }
      const click = (fx, fy, extra) => { ptr('pointerdown', disp(fx, fy), extra); ptr('pointerup', disp(fx, fy), extra); };
      function drag(p0, p1) {
        ptr('pointerdown', p0);
        for (let i = 1; i <= 5; i++) ptr('pointermove', [p0[0] + (p1[0] - p0[0]) * i / 5, p0[1] + (p1[1] - p0[1]) * i / 5]);
        ptr('pointerup', p1);
      }
      const dragF = (fx0, fy0, fx1, fy1) => drag(disp(fx0, fy0), disp(fx1, fy1));
      const labelDisp = (i) => app.toDisplay(app.current.labels[i].x, app.current.labels[i].y);
      const clickLabel = (i) => { const p = labelDisp(i); ptr('pointerdown', p); ptr('pointerup', p); };
      const dragLabel = (i, fx1, fy1) => drag(labelDisp(i), disp(fx1, fy1));
      // keys are sent to this instance's container (they bubble to the document listener), so other instances on the page do not react
      const key = (k, extra = {}) => app.container.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, ...extra }));
      const type = (text) => {
        check(!!app.entry, `entry opened for '${text}'`);
        app.entryEl.value = text;
        app.entryEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      };
      const texts = () => app.current.labels.map((l) => l.text);

      // ---- image 1 --------------------------------------------------------
      click(0.36, 0.38);
      check(!!app.entry && app.entry.tip, 'click opens an entry with a square');
      type('R1 10k');
      let lb = app.current.labels[0];
      check(app.current.labels.length === 1 && near(lb.tip[0], 0.36 * 4000) && near(lb.tip[1], 0.38 * 3000), `square at the click point: ${lb.tip.map(Math.round)}`);
      check(near(lb.x, 0.45 * 4000) && near(lb.y, 0.38 * 3000 - 0.06 * 4000), `text offset up-right: ${[lb.x, lb.y].map(Math.round)}`);
      check(lb.marker === 2.5 && lb.fill === COLOURS[0], 'new label takes default size and colour');

      dragF(0.62, 0.435, 0.80, 0.30);
      check(!!app.entry && near(app.entry.disp[0], disp(0.80, 0.30)[0]), 'drag opens the entry at the release point');
      type('LED (red)');
      lb = app.current.labels[1];
      check(near(lb.tip[0], 0.62 * 4000) && near(lb.x, 0.80 * 4000), 'dragged label: square at press, text at release');

      click(0.50, 0.75); type('oops');
      key('z'); check(texts().length === 2, 'Z undoes the add');
      key('y'); check(texts().length === 3 && texts()[2] === 'oops', 'Y redoes it');
      key('z');
      key('y'); key('y'); check(texts().length === 3 && app.statusEl.textContent.includes('Nothing to redo'), 'extra Y just flashes');
      key('z');

      click(0.50, 0.75); type(''); check(texts().length === 2, 'empty text adds nothing');
      click(0.50, 0.75); app.entryEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      check(!app.entry && texts().length === 2, 'Esc cancels');

      click(0.52, 0.605); app.entryEl.value = '555 timer';
      click(0.20, 0.30);
      check(texts().length === 3 && texts()[2] === '555 timer' && !!app.entry, 'click while typing commits then opens a new entry');
      type('VCC');
      click(0.85, 0.80, { shiftKey: true }); type('shift text');
      check(app.current.labels[4].tip === null, 'shift-click makes a text-only label');
      key('z');
      app.action('textOnly'); click(0.85, 0.80); type('toggle text');
      check(app.current.labels[4].tip === null && app.textOnly, 'Text only toggle makes a text-only label');
      app.action('textOnly'); key('z');
      click(0.40, 0.72);
      key('s'); check(app.index === 0 && texts().length === 4 && !!app.entry, 'S while typing does not save');
      type('GND wire');
      check(texts().length === 5, `five labels: ${texts()}`);

      // ---- move / select / edit / colour / size ------------------------------
      dragLabel(0, 0.46, 0.48);
      lb = app.current.labels[0];
      check(!app.entry && near(lb.x, 0.46 * 4000) && near(lb.y, 0.48 * 3000), `dragging text moves it: ${[lb.x, lb.y].map(Math.round)}`);
      check(near(lb.tip[0], 0.36 * 4000), 'square stays put while text moves');
      check(app.selected === 0, 'moved label is selected');
      key('z'); check(near(app.current.labels[0].x, 0.45 * 4000), 'Z undoes the move');
      key('y'); check(near(app.current.labels[0].x, 0.46 * 4000), 'Y redoes the move');
      clickLabel(0); key('z'); check(near(app.current.labels[0].x, 0.45 * 4000), 'plain click leaves no undo step');
      key('y');
      dragF(0.62, 0.435, 0.62, 0.50);
      lb = app.current.labels[1];
      check(near(lb.tip[1], 0.50 * 3000) && near(lb.x, 0.80 * 4000), 'dragging the square moves only the square');
      clickLabel(0); check(app.selected === 0 && !app.entry, 'click on a label selects it');
      key('c'); check(app.current.labels[0].fill === COLOURS[1] && app.style.fill === COLOURS[0], 'C with a selection recolours only that label');
      clickLabel(0); app.applyColour('#FF00FF');
      check(app.current.labels[0].fill === '#FF00FF' && outlineFor('#FF00FF') === '#FFFFFF', 'custom colour with auto outline');
      key('z'); check(app.current.labels[0].fill === COLOURS[1], 'Z undoes a recolour');
      key('y'); check(app.current.labels[0].fill === '#FF00FF', 'Y redoes it');
      clickLabel(0); key(']'); check(app.current.labels[0].marker === 2.75 && app.style.markerPct === 2.5, '] grows only the selected square');
      key('Escape'); check(app.selected === null, 'Esc clears the selection');
      key('['); check(app.style.markerPct === 2.25 && JSON.parse(localStorage.getItem('bbl.style')).markerPct === 2.25, '[ changes and persists the default square');
      key(']');
      key('+'); key('+'); key('-'); check(app.style.fontPct === 3.25, `+/- change text size: ${app.style.fontPct}`);
      clickLabel(2); key('Delete');
      check(texts().join() === 'R1 10k,LED (red),VCC,GND wire', `Delete removes the selected label: ${texts()}`);
      key('z'); check(texts().length === 5 && texts()[2] === '555 timer', 'Z restores it');
      key('y');
      click(0.56, 0.57); type('555 timer');          // on the chip, clear of the GND wire text box
      c.dispatchEvent(new MouseEvent('dblclick', { clientX: rect().left + labelDisp(2)[0], clientY: rect().top + labelDisp(2)[1], bubbles: true }));
      check(!!app.entry && app.entryEl.value === 'VCC' && app.entry.editing === 2, 'double-click edits the text');
      type('VCC 5V');
      check(texts()[2] === 'VCC 5V' && texts().length === 5, `edit replaces text: ${texts()}`);
      key('Escape');                                   // editing keeps the label selected
      for (let i = 0; i < COLOURS.length && app.style.fill !== '#000000'; i++) key('c');
      click(0.75, 0.75); type('black label');
      check(app.current.labels[5].fill === '#000000' && app.current.labels[0].fill === '#FF00FF', `new label takes current colour, old keep theirs (${app.current.labels[5].fill})`);
      check(app.style.fill === COLOURS[COLOURS.length - 1], 'black is the last built-in preset');
      key('c');
      check(app.style.fill === COLOURS[0], `colour cycle wraps: ${app.style.fill}`);
      for (const [name, col] of [['orange', '#FF9800'], ['dark blue', '#2962FF'], ['pink', '#FF66CC'], ['brown', '#8D5524'], ['light grey', '#D3D3D3']])
        check(COLOURS.includes(col) && !!app.swatchesEl.querySelector(`[data-colour="${col}"]`), `${name} preset exists`);
      check(!COLOURS.includes('#00E5FF') && !app.swatchesEl.querySelector('[data-colour="#00E5FF"]'), 'cyan preset removed');
      check(outlineFor('#2962FF') === '#FFFFFF' && outlineFor('#8D5524') === '#FFFFFF' && outlineFor('#D3D3D3') === '#000000' && outlineFor('#FF66CC') === '#000000',
        'text colour on the new presets: white on blue and brown, black on grey and pink');

      // ---- custom presets ----------------------------------------------------
      check(app.addPreset('#8E24AA') && app.custom.includes('#8E24AA'), 'custom preset added');
      check(!!app.swatchesEl.querySelector('.bbl-swatch-custom[data-colour="#8E24AA"]'), 'custom preset rendered as a swatch');
      check(JSON.parse(localStorage.getItem('bbl.customColours')).includes('#8E24AA'), 'custom preset persisted');
      check(!app.addPreset('#8e24aa'), 'duplicate preset (any case) is refused');
      app.style.fill = COLOURS[COLOURS.length - 1]; key('c');
      check(app.style.fill === '#8E24AA', 'C cycles into the custom preset after the built-ins');
      key('c'); check(app.style.fill === COLOURS[0], 'and wraps back to yellow');
      app.applyColour('#3F51B5'); app.action('addPreset');
      check(app.custom.length === 2 && app.custom[1] === '#3F51B5', '+ button saves the current colour');
      app.swatchesEl.querySelector('[data-colour="#3F51B5"]').dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
      check(app.custom.length === 1 && !app.swatchesEl.querySelector('[data-colour="#3F51B5"]'), 'right-click removes a custom preset');
      app.applyColour(COLOURS[0]);

      // ---- colour changes while typing apply immediately ---------------------
      click(0.15, 0.60);
      app.swatchesEl.querySelector('[data-colour="#FF9800"]').click();
      check(!!app.entry && app.entry.fill === '#FF9800' && app.entryEl.style.backgroundColor === 'rgb(255, 152, 0)',
        'clicking a swatch while typing recolours the pending label at once');
      check(app.style.fill === '#FF9800', 'and it becomes the default for later labels');
      type('orange one');
      check(app.current.labels.at(-1).fill === '#FF9800' && app.current.labels.at(-1).text === 'orange one', 'the placed label keeps that colour');
      c.dispatchEvent(new MouseEvent('dblclick', { clientX: rect().left + labelDisp(0)[0], clientY: rect().top + labelDisp(0)[1], bubbles: true }));
      app.swatchesEl.querySelector('[data-colour="#2962FF"]').click();
      check(!!app.entry && app.current.labels[0].fill === '#2962FF' && app.entry.fill === '#2962FF', 'while editing, a swatch recolours that label immediately');
      app.entryEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); key('Escape');
      check(app.current.labels[0].fill === '#2962FF', 'the recolour survives cancelling the edit');
      key('z'); check(app.current.labels[0].fill === '#FF00FF', 'and Z undoes it');
      key('z'); check(app.current.labels.length === 6, 'Z removes the orange test label');
      app.applyColour(COLOURS[0]);

      // ---- full-res render ----------------------------------------------------
      const full = app.renderFull();
      check(full.width === 4000 && full.height === 3000, 'full render keeps resolution');
      const px = (cv, x, y) => { const d = cv.getContext('2d').getImageData(Math.round(x), Math.round(y), 1, 1).data; return '#' + [...d].slice(0, 3).map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase(); };
      lb = app.current.labels[0];
      check(px(full, lb.tip[0], lb.tip[1]) === '#FF00FF', `square is solid fill colour: ${px(full, lb.tip[0], lb.tip[1])}`);
      const boxes = drawLabels(document.createElement('canvas').getContext('2d'), app.current.labels, 4000, app.style, 1);
      const b0 = boxes[0];
      check(px(full, b0[0] + 8, (b0[1] + b0[3]) / 2) === '#FF00FF', 'text box is solid fill colour');
      const blob = await app.saveBlob();
      check(blob && blob.type === 'image/jpeg' && blob.size > 50000, `saveBlob makes a jpeg (${blob.size} bytes)`);
      const q95 = await new Promise((r) => app.renderFull().toBlob(r, 'image/jpeg', 0.95));
      check(blob.size < q95.size * 0.8, `default JPEG quality is below 0.95: ${blob.size} vs ${q95.size} bytes at 0.95`);
      check(app.style.format === 'jpg' && app.outputName(app.current).name === 'IMG_0001_labeled.jpg', 'default output is JPG');
      check(app.outputName(app.images[1]).name === 'IMG_0002_labeled.jpg', 'PNG input still saves as JPG');
      app.setFormat('png');
      check(app.outputName(app.images[1]).name === 'IMG_0002_labeled.png' && app.formatSelect.value === 'png', 'format switch to PNG');
      const pngBlob = await app.saveBlob(app.images[0]);
      check(pngBlob.type === 'image/png', 'JPG input saves as PNG when chosen');
      check(JSON.parse(localStorage.getItem('bbl.style')).format === 'png', 'format persisted');
      app.setFormat('jpg');

      // ---- persistence and navigation ---------------------------------------
      const stored = JSON.parse(localStorage.getItem('bbl.labels'));
      const key1 = app.images[0].key;
      check(stored[key1].length === 6 && stored[key1][0].fill === '#FF00FF' && stored[key1][0].marker === 2.75, 'labels persisted to localStorage with colour and size');
      key('n'); check(app.index === 1 && app.current.labels.length === 0 && app.selected === null, 'N moves to the next image, clean');
      check(app.current.undo.length === 0, 'undo history is per image');
      await tick(200);   // the next photo decodes on demand
      check(!!app.current.bitmap && app.current.width === 1200, 'next photo decoded on demand');
      click(0.36, 0.40); type('220 Ω');
      key('p'); check(app.index === 0 && app.current.labels.length === 6, 'P goes back and labels are still there');
      key('n'); check(app.current.labels[0].text === '220 Ω', 'image 2 labels kept');
      key('n'); check(app.index === 1 && app.statusEl.textContent.includes('No more'), 'N past the end flashes');
      // re-open the same file in a fresh instance: labels restored from storage
      const app2 = new Labeler(document.createElement('div'), { resume: false });
      document.body.appendChild(app2.container);
      await app2.openFiles([f1]); await tick();
      check(app2.current.labels.length === 6 && app2.current.labels[2].text === 'VCC 5V', 'reopening a photo restores its labels');
      check(app2.style.markerPct === 2.5 && app2.style.fontPct === 3.25, 'style restored in a fresh instance');
      app2.container.remove();
      // a "folder" pick: files carry webkitRelativePath; sorted naturally, outputs and non-images dropped
      const app3 = new Labeler(document.createElement('div'), { resume: false });
      document.body.appendChild(app3.container);
      const mk = async (name, rel) => { const f = await toFile(makeBoard(300, 200), name, 'image/png'); Object.defineProperty(f, 'webkitRelativePath', { value: rel }); return f; };
      await app3.openFiles([await mk('b10.png', 'lab/b10.png'), await mk('b2.png', 'lab/b2.png'), await mk('a_labeled.png', 'lab/a_labeled.png'), await mk('a.png', 'lab/a.png')]);
      await tick();
      check(app3.images.map((i) => i.name).join() === 'a.png,b2.png,b10.png', `folder pick keeps originals in natural order: ${app3.images.map((i) => i.name)}`);
      app3.container.remove();
      const f1bytes = await f1.arrayBuffer();
      check(f1bytes.byteLength === f1.size, 'original File object is untouched');

      // ---- HEIC via the lazily loaded decoder ---------------------------------
      const heicBlob = await (await fetch('./sample.heic')).blob();
      const heicFile = new File([heicBlob], 'IMG_0003.heic', { type: '', lastModified: 1700000000001 });   // Windows often reports no type
      check(isImageFile(heicFile) && isHeic(heicFile), 'heic recognised by extension even with an empty MIME type');
      check(!isImageFile(new File(['x'], 'IMG_0003_labeled_2.heic')), 'numbered outputs are skipped');
      const app4 = new Labeler(document.createElement('div'), { resume: false });
      document.body.appendChild(app4.container);
      await app4.openFiles([heicFile]); await tick();
      check(app4.images.length === 1 && app4.current.width === 640 && app4.current.height === 480,
        `HEIC decoded: ${app4.images.length ? app4.current.width + 'x' + app4.current.height : app4.statusEl.textContent}`);
      check(app4.outputName(app4.current).name === 'IMG_0003_labeled.jpg', 'HEIC saves as JPG');
      const heicOut = await app4.saveBlob();
      check(heicOut && heicOut.type === 'image/jpeg' && heicOut.size > 1000, `HEIC output blob is a jpeg (${heicOut && heicOut.size} bytes)`);
      // 10-bit HEIC (what iPhone 15+ shoots by default)
      const heic10 = new File([await (await fetch('./sample10.heic')).blob()], 'IMG_0004.heic', { type: 'image/heic', lastModified: 1700000000002 });
      await app4.openFiles([heic10]); await app4.load(1);
      check(app4.images.length === 2 && app4.current.width === 640, `10-bit HEIC decoded: ${app4.images.length === 2 ? app4.current.width + 'x' + app4.current.height : app4.statusEl.textContent}`);
      if (app4.images.length === 2) {
        const cv10 = app4.renderFull();
        const p10 = px(cv10, 340, 240);
        check(p10.startsWith('#F') && p10.slice(3, 5) < '40', `10-bit red region decoded with plausible colour: ${p10}`);
      }
      // does the decoder choice matter? try the old one on the same file, report only
      try {
        await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
        let oldOk = false, oldErr = '';
        try { const o = await window.heic2any({ blob: heic10, toType: 'image/png' }); oldOk = !!(Array.isArray(o) ? o[0] : o).size; } catch (e) { oldErr = (e && (e.message || e.code)) || JSON.stringify(e); }
        out.push(`INFO old decoder (heic2any 0.0.4) on the 10-bit file: ${oldOk ? 'decoded fine' : 'FAILED: ' + oldErr}`);
      } catch { out.push('INFO old decoder could not be loaded for comparison'); }
      const bad = new File([new Uint8Array([1, 2, 3, 4])], 'broken.heic', { type: 'image/heic' });
      await app4.openFiles([bad]); await app4.load(2);
      check(app4.images.length === 2 && app4.index === 1 && !!app4.current.bitmap && app4.statusEl.textContent.includes('Could not open'),
        `a broken file is reported and dropped, not fatal (images=${app4.images.length}, index=${app4.index}, status="${app4.statusEl.textContent}")`);
      app4.container.remove();

      // ---- memory: decode on demand, keep only current +/- 1 -------------------
      const app5 = new Labeler(document.createElement('div'), { resume: false });
      document.body.appendChild(app5.container);
      const many = [];
      for (let i = 0; i < 5; i++) many.push(await toFile(makeBoard(300, 200), `m${i}.png`, 'image/png'));
      await app5.openFiles(many); await tick(300);
      const decoded = () => app5.images.map((im, i) => (im.bitmap ? i : null)).filter((i) => i !== null);
      check(app5.index === 0 && app5.current.bitmap && decoded().length <= 2, `opening 5 photos decodes at most the first two: ${JSON.stringify(decoded())}`);
      await app5.load(4); await tick(300);
      check(app5.images[0].bitmap === null && app5.images[1].bitmap === null && app5.images[4].bitmap && decoded().length <= 2,
        `far photos are evicted after navigating: decoded=${JSON.stringify(decoded())}`);
      await app5.load(0);
      check(!!app5.current.bitmap && app5.current.width === 300, 'an evicted photo re-decodes when you come back');
      app5.container.remove();

      // ---- rendering: drag redraws are coalesced to one per frame -------------
      app.load(0); await tick(100);
      {
        const p0 = labelDisp(0);
        ptr('pointerdown', p0);
        let redraws = 0; const orig = app.refresh;

        check(Math.abs((boxM[2] - boxM[0]) - (boxRaw[2] - boxRaw[0])) > 10, `the box is laid out around the typeset maths (${Math.round(boxRaw[2] - boxRaw[0])} -> ${Math.round(boxM[2] - boxM[0])} px wide)`);
        const fullM = app.renderFull();
        const region = (cv) => cv.getContext('2d').getImageData(Math.round(boxM[0]), Math.round(Math.min(boxM[1], boxRaw[1])), Math.round(Math.max(boxM[2], boxRaw[2]) - boxM[0]), Math.round(Math.max(boxM[3], boxRaw[3]) - Math.min(boxM[1], boxRaw[1]))).data;
        const a = region(rawRender), b = region(fullM);
        let diff = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 60) diff++;
        check(diff > 500, `the typeset maths replaces the raw TeX in the saved photo (${diff} pixels changed)`);
        let dark = 0; for (let i = 0; i < b.length; i += 4) if (b[i] < 50 && b[i + 1] < 50 && b[i + 2] < 50) dark++;
        check(dark > 300, `glyphs are drawn in the text colour inside the box (${dark} dark pixels)`);
        check(fullM.toDataURL().length > 100, 'the canvas is not tainted by the SVG images');
        const blobM = await app.saveBlob();
        check(blobM && blobM.size > 1000, 'saving waits for the typesetting and makes a file');
        // a second label with the same expression reuses the cache; a different one renders on its own
        const sameE = math.get('V_{out}'); check(sameE === e, 'an expression is typeset once and shared');
        app.current.labels.push({ x: 2000, y: 2000, text: 'R = 10 k$\\Omega$', tip: null, fill: '#2962FF', marker: 2.5 });
        app.refresh();
        await math.ready(app.current.labels);
        check(math.cache.get('\\Omega').status === 'ready' && math.cache.get('\\Omega').imgs['#FFFFFF'].naturalWidth > 0, 'white glyphs are ready for dark boxes');
        app.current.labels.pop();
        let notified = 0; const unsub = () => notified++; math.listen(unsub);
        app.current.labels.push({ x: 2000, y: 2200, text: '$\\frac{1}{2}$', tip: null, fill: '#FFEB3B', marker: 2.5 });
        app.refresh();
        await math.ready(app.current.labels);
        check(notified >= 1, 'listeners are told when a new expression is ready, so the photo redraws');
        math.listeners.delete(unsub);
        app.current.labels.pop();
        key('Escape'); key('z');
        check(app.current.labels.length === n0, 'cleanup');
        app.persist(); app.refresh();
      }

      // screenshot state for a visual check
      app.load(0); app.selected = 0; app.refresh();
      // ---- File System Access: folder handles, save in place, session restore --
      if (FS_ACCESS && navigator.storage && navigator.storage.getDirectory) {
        const root = await navigator.storage.getDirectory();           // OPFS handles are real FileSystemHandles
        try { await root.removeEntry('lab-week3', { recursive: true }); } catch {}
        const dir = await root.getDirectoryHandle('lab-week3', { create: true });
        const put = async (d, name, w, h) => {
          const fh = await d.getFileHandle(name, { create: true }); const ws = await fh.createWritable();
          ws.write(await new Promise((r) => makeBoard(w, h).toBlob(r, 'image/png'))); await ws.close();
        };
        await put(dir, 'IMG_0010.png', 400, 300); await put(dir, 'IMG_0002.png', 400, 300); await put(dir, 'IMG_0002_labeled.png', 20, 20);
        const sub = await dir.getDirectoryHandle('day2', { create: true }); await put(sub, 'IMG_0020.png', 400, 300);
        const names = async (d) => { const o = []; for await (const [n] of d.entries()) o.push(n); return o.sort(); };
        const sizeOf = async (d, n) => (await (await d.getFileHandle(n)).getFile()).size;
        const origSize = await sizeOf(dir, 'IMG_0002.png');

        const app6 = new Labeler(document.createElement('div'), { resume: false });
        document.body.appendChild(app6.container);
        await app6.openDirectoryHandle(dir);
        check(app6.images.map((i) => i.name).join() === 'IMG_0002.png,IMG_0010.png,IMG_0020.png',
          `folder handle lists originals in natural order, recursively, skipping outputs: ${app6.images.map((i) => i.name)}`);
        check(app6.images.every((i) => i.dir === dir && i.handle && i.path), 'entries carry folder and file handles');
        check(app6.statusEl.textContent.includes('into its folder'), 'status says saves go into the folder');
        app6.current.labels.push({ x: 200, y: 100, text: 'C1', tip: [120, 160], fill: '#FFEB3B', marker: 2.5 });
        check(await app6.save(), 'save writes into the folder');
        check((await names(dir)).includes('IMG_0002_labeled.jpg'), `labelled copy appears next to the original: ${await names(dir)}`);
        const outFile = await (await dir.getFileHandle('IMG_0002_labeled.jpg')).getFile();
        const head = new Uint8Array(await outFile.slice(0, 2).arrayBuffer());
        check(head[0] === 0xFF && head[1] === 0xD8 && outFile.size > 1000, `saved file is a real JPEG (${outFile.size} bytes)`);
        check(await app6.save() && (await names(dir)).includes('IMG_0002_labeled_2.jpg'), 'a second save makes _labeled_2 instead of overwriting');
        check((await sizeOf(dir, 'IMG_0002.png')) === origSize, 'the original is untouched');
        await app6.load(2);
        check(await app6.save() && (await names(sub)).includes('IMG_0020_labeled.jpg'), `a photo from a subfolder is saved in that subfolder: ${await names(sub)}`);
        app6.setSaveTo('download');
        check(app6.statusEl.textContent.includes('to Downloads') && JSON.parse(localStorage.getItem('bbl.style')).saveTo === 'download', 'save target switch is shown and persisted');
        app6.setSaveTo('folder');

        // session restore into a fresh instance (permission on OPFS handles is already granted)
        const app7 = new Labeler(document.createElement('div'), { resume: false });
        document.body.appendChild(app7.container);
        check(await app7.restoreSession({ interactive: false }), 'session restores without prompting when permission is still granted');
        check(app7.images.length === 3 && app7.index === 2 && app7.current.name === 'IMG_0020.png', `restored queue and position: ${app7.images.length} photos, at ${app7.index}`);
        check(app7.images[0].labels.length === 1 && app7.images[0].labels[0].text === 'C1', 'labels come back with the restored photos');
        check(app7.images.every((i) => i.dir && i.path && i.cached), 'restored entries came from the cache and still know their folder for saving');
        // the automatic path used at startup
        const app8 = new Labeler(document.createElement('div'));
        document.body.appendChild(app8.container);
        await tick(400);
        check(app8.images.length === 3 && app8.index === 2, `startup auto-restore: ${app8.images.length} photos at ${app8.index}`);
        check(app8.resumeBtn.hidden, 'no resume button needed after auto-restore');
        await app8.clearSession();
        app6.container.remove(); app7.container.remove(); app8.container.remove();
        await root.removeEntry('lab-week3', { recursive: true });
      } else out.push('INFO File System Access API not available here; folder/session tests skipped');

      // ---- byte cache: restore with no handles and no prompt; two-week expiry ---
      if (navigator.storage && navigator.storage.getDirectory) {
        const lsNames = async (d) => { const o = []; for await (const [n] of d.entries()) o.push(n); return o.sort(); };
        const cacheDir = await (await navigator.storage.getDirectory()).getDirectoryHandle('cache', { create: true });
        const app9 = new Labeler(document.createElement('div'), { resume: false });
        document.body.appendChild(app9.container);
        await app9.clearSession();
        await app9.pruneCache(Date.now() + 2 * CACHE_MAX_AGE);          // start from an empty cache
        check((await lsNames(cacheDir)).length === 0, 'cache emptied for the test');
        await app9.openFiles([f1, f2]);                                  // plain Files: no handles at all
        await app9.whenCached();
        check(app9.images.every((i) => i.cached) && (await lsNames(cacheDir)).length === 2, `originals copied into the cache: ${(await lsNames(cacheDir)).length} files`);
        const cacheIndex = await new Promise((res) => { const r = indexedDB.open('bbl', 1); r.onsuccess = () => { const t = r.result.transaction('kv').objectStore('kv').get('cache'); t.onsuccess = () => res(t.result); }; });
        check(cacheIndex && Object.keys(cacheIndex).length === 2 && Object.values(cacheIndex).every((t) => Date.now() - t < 60000), 'cache index records when each copy was made');
        await app9.load(1);
        const app10 = new Labeler(document.createElement('div'), { resume: false });
        document.body.appendChild(app10.container);
        check(await app10.restoreSession({ interactive: false }), 'session restores from the byte cache with no handles and no prompt');
        check(app10.images.length === 2 && app10.index === 1 && app10.current.name === 'IMG_0002.png', `restored 2 photos at position 1: ${app10.images.map((i) => i.name)} @ ${app10.index}`);
        check(app10.images[0].file.size === f1.size && app10.images[0].key === app9.images[0].key, 'restored file has the same bytes and identity, so its labels match');
        check(app10.images[0].labels.length === 6, `labels attached to the restored photo: ${app10.images[0].labels.length}`);
        check(!!app10.current.bitmap && app10.current.width === 1200, 'restored bytes decode');
        check(app10.images.every((i) => i.cached) && (await lsNames(cacheDir)).length === 2, 'restoring does not duplicate cache entries');
        // startup path on a browser without the File System Access API is the same code: simulate by clearing handles
        const app11 = new Labeler(document.createElement('div'));
        document.body.appendChild(app11.container);
        await tick(400);
        check(app11.images.length === 2 && app11.index === 1 && app11.resumeBtn.hidden, `startup auto-restore from cache: ${app11.images.length} photos at ${app11.index}`);
        // expiry: anything older than two weeks goes, newer stays
        const removed = await app11.pruneCache(Date.now() + CACHE_MAX_AGE - 60000);
        check(removed === 0 && (await lsNames(cacheDir)).length === 2, 'copies younger than two weeks are kept');
        const removed2 = await app11.pruneCache(Date.now() + CACHE_MAX_AGE + 60000);
        check(removed2 === 2 && (await lsNames(cacheDir)).length === 0, `copies older than two weeks are discarded (${removed2} removed)`);
        const app12 = new Labeler(document.createElement('div'), { resume: false });
        check(!(await app12.restoreSession({ interactive: false })), 'with the cache gone and no handles, nothing restores (no crash)');
        await app12.clearSession();
        for (const a of [app9, app10, app11, app12]) a.container.remove();
      } else out.push('INFO OPFS not available here; cache tests skipped');
    } catch (err) {
      check(false, `exception: ${err && err.stack || err}`);
    }
    out.push('', `FAILURES: ${fails}`);
    document.getElementById('results').textContent = out.join('\n');
    document.title = 'DONE';
  </script>
</body>
</html>
